org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Low-memory VM (8 GB shared with other agents' jobs): cap Gradle
# workers so the daemon + Kotlin compiler + Dart AOT compiler do not
# OOM each other. The Flutter template's -Xmx8G OOM-killed the daemon
# on the first build attempt (2026-11-16).
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# NOTE: machine-specific proxy config (e.g. this VM's sandbox egress
# proxy) must NOT live here — it belongs in ~/.gradle/gradle.properties
# on that machine. A proxy in this file would break builds anywhere
# else (e.g. GitHub Actions runners), because Gradle routes all of its
# dependency downloads through it.
