org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Low-memory VM (8 GB shared with other agents' jobs): cap Gradle
# workers so the daemon + Kotlin compiler + Dart AOT compiler do not
# OOM each other. The Flutter template's -Xmx8G OOM-killed the daemon
# on the first build attempt (2026-11-16).
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Sandbox egress proxy (see API_REFERENCE.md): Java MUST use the IPv6
# proxy literal, not the hostname. Without these, Gradle dependency
# downloads fail in this VM.
systemProp.http.proxyHost=fd8b:4f84:7d32:99::1
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=fd8b:4f84:7d32:99::1
systemProp.https.proxyPort=3128
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
