name: redunator
description: "Redunator — Chicago red-light-camera ticket-risk predictor. Map, hourly risk estimates, route risk, and proximity alerts backed by the Redunator FastAPI backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  audioplayers: ^6.5.1
  http: ^1.4.0
  shared_preferences: ^2.5.3
  fl_chart: ^1.1.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  in_app_purchase: ^3.3.1
  workmanager: ^0.10.10
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/alert.wav
    - assets/tap.wav
