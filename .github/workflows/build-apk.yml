name: Build Android APK

# Builds the Redunator Flutter app and publishes the release APK as a
# GitHub Release asset (plus an Actions artifact). The app talks to the
# live Cloud Run backend (defaultBaseUrl in app/lib/config.dart).
# Runs on every push that touches the app, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      test_tier:
            description: 'Test tier override for this build (none = normal release build)'
            required: false
          default: 'none'
          type: choice
          options:
          - none
          - pro
          - exclusive
permissions:
  contents: write

# The Gradle wrapper downloads its distribution from services.gradle.org.
# On some runners the JVM tries IPv6 first and the connect fails with
# "Network is unreachable" (run #1, 2026-11-17). JAVA_TOOL_OPTIONS is
# picked up by every JVM the build spawns (wrapper, daemon, workers),
# so forcing IPv4 there covers all of them.
env:
  JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      # Cache the downloaded Gradle distribution so later runs never
      # have to fetch it again (and a failed first download is retried
      # by the build step below instead of failing the whole run).
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Stable release signing (apk-14): the keystore lives only in
      # GitHub Actions secrets — never in the repo. Without this step
      # every build signs with a fresh debug key and Android refuses
      # in-app updates (apk-12 -> apk-13 conflict, 2026-11-19).
      # Secrets (all set 2026-11-19): ANDROID_KEYSTORE_BASE64 (base64
      # of upload-keystore.jks), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Passwords are base64
      # (A-Za-z0-9+/= only), so the unquoted heredoc below is safe.
      - name: Set up release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # Google Maps API key: the GOOGLE_MAPS_API_KEY secret is injected
      # at build time — as env MAPS_API_KEY for the Android manifest
      # (build.gradle.kts) and as --dart-define for the Dart check
      # (lib/config.dart). The key must never appear in the repo: a
      # committed key was flagged exposed twice and rotated out
      # (apk-19). GitHub masks the secret in logs.
      # Test tier override: REDUNATOR_TEST_TIER is 'none' for every
      # normal build (push or a dispatch left at none), so the store
      # gating is untouched. A dispatch with pro/exclusive builds a
      # test APK with the paid features unlocked in-memory only (see
      # SubscriptionService) — that build is never published as a
      # public release (see the condition on the release step below).
      - name: Build release APK
        working-directory: app
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: flutter build apk --release --build-number ${{ github.run_number }} --dart-define=MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} --dart-define=REDUNATOR_TEST_TIER=${{ inputs.test_tier || 'none' }} || flutter build apk --release --build-number ${{ github.run_number }} --dart-define=MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} --dart-define=REDUNATOR_TEST_TIER=${{ inputs.test_tier || 'none' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release with the APK
      if: ${{ inputs.test_tier == 'none' || inputs.test_tier == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/app/outputs/flutter-apk/app-release.apk \
            --title "Redunator APK (build ${{ github.run_number }})" \
            --notes "Release APK built from main (${{ github.sha }}). Points at the live Cloud Run backend: https://redunator-api-108691448805.us-central1.run.app"
