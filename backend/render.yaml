# Redunator Phase 3 backend — Render Blueprint (Worker C, 2026-11-16).
#
# Deploy with: Render dashboard -> New -> Blueprint -> point at the
# repo containing this file. Full steps: backend/DEPLOY.md.
#
# WHY DOCKER (not Render's native Python runtime): the working tree is
# 3.3 GB (a 2.9 GB reference model + 524 MB of raw data). A native
# Python service clones the whole repo; the Docker build honours the
# repo-root .dockerignore and ships only the ~200 MB the backend
# actually reads. Do NOT switch this to env: python without also
# slimming the repo.
#
# WHY PLAN standard, NOT free: measured warm RSS of one uvicorn worker
# is ~1.2 GB (joblib RF ~295 MB + feature parquet ~390 MB + ONNX
# session ~330 MB, measured 2026-11-16). The free instance has
# 512 MB and WILL OOM. Standard (1 CPU / 2 GB, $25/mo at time of
# writing) fits. Dropping to free needs the slimming work listed in
# DEPLOY.md § "Getting back to the free tier" — it is NOT done yet.
#
# No database is declared here on purpose: the default SQLite store
# keeps user reports/alerts in data/redunator.db, which is EPHEMERAL
# on Render (no persistent disk on free/standard web services — the
# file is lost on every redeploy/spin-down). Add the commented-out
# Postgres block below only if Gabriel wants user data to survive
# deploys (free Postgres expires after 30 days; see DEPLOY.md).

services:
  - type: web
    name: redunator-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: standard
    healthCheckPath: /health
    envVars:
      # Public web origin for the Flutter app goes here when it exists.
      # Keep localhost entries for local dev; the backend's default
      # CORS list already covers them.
      - key: REDUNATOR_CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080"
      - key: REDUNATOR_RATE_LIMIT_PER_MIN
        value: "100"
      # No REDUNATOR_API_KEY by default: the user endpoints are open
      # in local dev. Set one (Render "Generate" a random value) to
      # gate them behind X-Api-Key — still NOT a substitute for JWT
      # auth before any public launch (see DEPLOY.md).
      # - key: REDUNATOR_API_KEY
      #   generateValue: true
      # Live-signal providers that need keys stay unset until Gabriel
      # creates them (Open-Meteo + Divvy work key-free; the key-gated
      # providers degrade gracefully and are listed as dropped).
      # - key: TOMTOM_API_KEY
      #   sync: false
      # - key: HERE_API_KEY
      #   sync: false
      # - key: CTA_BUS_API_KEY
      #   sync: false

  # --- Optional: Postgres for user data (uncomment to use) -----------
  # databases:
  #   - name: redunator-db
  #     plan: free        # 1 GB, EXPIRES after 30 days — then the data is gone
  #     databaseName: redunator
  #     user: redunator
  # And add to the web service envVars:
  #   - key: DATABASE_URL
  #     fromDatabase:
  #       name: redunator-db
  #       property: connectionString
  # Requires psycopg (already in requirements.txt, 3.3.9). PostGIS is
  # NOT needed (locations are plain lat/lon columns).
